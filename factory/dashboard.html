<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Software Factory</title>
<style>
  :root { --bg:#0e0e10; --panel:#16161a; --line:#26262c; --text:#e8e8ea; --dim:#8a8a93;
          --pass:#3fb950; --fail:#f85149; --run:#d29922; --idle:#3a3a42; --accent:#a78bfa; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f6f6f4; --panel:#fff; --line:#e4e4e0; --text:#1a1a1c; --dim:#6b6b72; --idle:#d8d8d4; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  header { display:flex; justify-content:space-between; align-items:baseline; padding:16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:14px; margin:0; letter-spacing:.04em; }
  header span { color:var(--dim); font-size:12px; }
  .board { display:grid; grid-template-columns:repeat(5, minmax(200px, 1fr)); gap:12px; padding:16px; overflow-x:auto; }
  .col h2 { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:0 0 8px; font-weight:500; }
  .col h2 small { color:var(--dim); opacity:.7; text-transform:none; letter-spacing:0; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:8px; }
  .card.live { border-color:var(--accent); }
  .id { color:var(--dim); font-size:11px; }
  .feat { margin:4px 0 8px; }
  .chips { display:flex; flex-wrap:wrap; gap:4px; }
  .chip { font-size:11px; padding:1px 6px; border-radius:99px; background:var(--idle); color:var(--text); }
  .chip.PASS { background:var(--pass); color:#000; } .chip.FAIL { background:var(--fail); color:#000; }
  .chip.running { background:var(--run); color:#000; }
  .meta { color:var(--dim); font-size:11px; margin-top:6px; }
  .active { color:var(--accent); font-size:11px; margin-top:6px; }
  .active::before { content:"● "; animation:blink 1s infinite; }
  @keyframes blink { 50% { opacity:.2; } }
  .empty { color:var(--dim); font-size:12px; }
  .err { padding:16px; color:var(--fail); }
  @media (max-width:700px) { .board { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header><h1>SOFTWARE FACTORY</h1><span id="updated">loading…</span></header>
<div class="board" id="board"></div>
<script>
const COLS = [
  ["Spec", ["spec"], "spec-writer"],
  ["Build", ["build"], "builder"],
  ["Review", ["review"], "code · security · ui · ux"],
  ["Human", ["human-review", "blocked"], "you"],
  ["Done", ["approved", "rejected"], ""],
];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function card(j) {
  const chips = Object.entries(j.reviews || {}).map(([k, v]) => `<span class="chip ${esc(v)}">${esc(k)}</span>`).join("");
  return `<div class="card ${j.active ? "live" : ""}">
    <div class="id">${esc(j.id)} · round ${esc(j.round ?? 1)} · ${esc(j.stage)}</div>
    <div class="feat">${esc(j.feature)}</div>
    ${chips ? `<div class="chips">${chips}</div>` : ""}
    ${j.active ? `<div class="active">${esc(j.active)}</div>` : ""}
    ${j.note ? `<div class="meta">${esc(j.note)}</div>` : ""}
  </div>`;
}
async function tick() {
  try {
    const r = await fetch("board.json?t=" + Date.now(), { cache: "no-store" });
    const { jobs = [] } = await r.json();
    document.getElementById("board").innerHTML = COLS.map(([name, stages, who]) => {
      const js = jobs.filter(j => stages.includes(j.stage));
      return `<div class="col"><h2>${name} <small>${who}</small></h2>${js.map(card).join("") || '<div class="empty">—</div>'}</div>`;
    }).join("");
    document.getElementById("updated").textContent = "updated " + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById("board").innerHTML = `<div class="err">Can't read board.json. Serve this folder: python3 -m http.server 7777 -d factory</div>`;
  }
}
tick(); setInterval(tick, 2000);
</script>
</body>
</html>
